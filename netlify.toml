# Netlify configuration for Horizon Properties (Vite SPA)
[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback: all routes (e.g. /properties/villa-x) serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-term caching for hashed build assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Accept-Ranges = "bytes"
